<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaimPilot</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #f6f7f9; color: #1a1d21; margin: 0; padding: 48px 24px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #5a6169; margin: 0 0 24px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 6px;
             padding: 10px 18px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: default; }
    #status { margin-left: 12px; font-size: 14px; }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ClaimPilot API is running.</h1>
    <p>Clearing the demo wipes all stored claims and file records, including the
       perceptual hashes that cause repeat photos to be rejected as duplicates.</p>
    <button id="resetBtn" onclick="resetDemo()">Reset demo</button>
    <span id="status"></span>
  </div>

  <script>
    async function resetDemo() {
      if (!confirm('Delete all claims and file records? This cannot be undone.')) return;
      const btn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.textContent = 'Clearing...';
      status.className = '';
      try {
        const res = await fetch('/api/demo/reset', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.cleared) throw new Error('HTTP ' + res.status);
        status.textContent = 'Demo data cleared.';
        status.className = 'ok';
      } catch (e) {
        status.textContent = 'Reset failed: ' + e.message;
        status.className = 'err';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
